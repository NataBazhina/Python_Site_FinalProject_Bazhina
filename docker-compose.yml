services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: nat_dp_bd
      POSTGRES_USER: Nata
      POSTGRES_PASSWORD: qwerty
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U Nata -d nat_dp_bd"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s

  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - ./media:/app/media
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      DB_NAME: nat_dp_bd
      DB_USER: Nata
      DB_PASSWORD: qwerty
      DB_HOST: db
      DB_PORT: 5432
      DEBUG: 1
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
